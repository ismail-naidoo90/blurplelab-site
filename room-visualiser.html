<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room Visualiser Test — BlurpleLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blurple:     #250b52;
      --nav:         #0d1b2e;
      --white:       #ffffff;
      --bg-light:    #f7f8fc;
      --card-border: #e2e8f0;
      --text:        #0d1b2e;
      --muted:       #64748b;
      --accent:      #7c3aed;
      --col-original: #64748b;
      --col-chatgpt:  #10a37f;
      --col-gemini:   #4285f4;
      --font:        'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--white);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.65);
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-link:hover { color: #ffffff; }

    /* ── PAGE HEADER ── */
    .page-header {
      background: var(--blurple);
      padding: 52px 28px 48px;
      text-align: center;
    }

    .page-header-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 12px;
    }

    .page-header h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .page-header p {
      font-size: 1rem;
      color: rgba(255,255,255,0.72);
      font-weight: 400;
    }

    /* ── MAIN ── */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 28px 80px;
    }

    /* ── STYLE SELECTOR ── */
    .selector-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .style-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .style-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 20px;
      border-radius: 50px;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: var(--white);
      color: var(--muted);
      transition: border-color 0.15s, color 0.15s, background 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }

    .style-pill:hover:not(.active) {
      border-color: var(--blurple);
      color: var(--blurple);
    }

    .style-pill.active {
      background: var(--blurple);
      border-color: var(--blurple);
      color: #ffffff;
      box-shadow: 0 2px 12px rgba(37,11,82,0.25);
    }

    .style-desc {
      font-size: 0.875rem;
      color: var(--muted);
      font-weight: 500;
      min-height: 1.4em;
      text-align: center;
    }

    /* ── COMPARISON ── */
    .comparison {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .comp-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comp-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .comp-label.original { color: var(--col-original); }
    .comp-label.chatgpt  { color: var(--col-chatgpt); }
    .comp-label.gemini   { color: var(--col-gemini); }

    .img-wrap {
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      border: 1.5px solid;
      cursor: zoom-in;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .img-wrap.original { border-color: var(--card-border); }
    .img-wrap.chatgpt  { border-color: var(--col-chatgpt); }
    .img-wrap.gemini   { border-color: var(--col-gemini); }

    .img-wrap:hover {
      box-shadow: 0 4px 20px rgba(37,11,82,0.15);
      border-color: var(--blurple);
    }

    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s ease;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--nav);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-logo {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .footer-copy {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .comparison { grid-template-columns: 1fr; gap: 28px; }
      .main { padding: 36px 20px 60px; }
      .style-pill { font-size: 0.8rem; padding: 9px 15px; }
      footer { justify-content: center; text-align: center; }
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lb-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(13,27,46,0.97);
      cursor: zoom-out;
    }

    .lb-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 18px 22px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      z-index: 201;
      pointer-events: none;
    }

    .lb-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lb-label-text {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .lb-style-text {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
    }

    .lb-close {
      pointer-events: all;
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .lb-close:hover { background: rgba(255,255,255,0.15); color: #ffffff; }

    .lb-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 201;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .lb-arrow:hover { background: rgba(255,255,255,0.15); color: #ffffff; }
    .lb-arrow.prev { left: 16px; }
    .lb-arrow.next { right: 16px; }

    .lb-img {
      position: relative;
      z-index: 1;
      max-width: calc(100vw - 160px);
      max-height: calc(100vh - 100px);
      object-fit: contain;
      border-radius: 6px;
      display: block;
    }

    @media (max-width: 600px) {
      .lb-img { max-width: calc(100vw - 80px); max-height: calc(100vh - 120px); }
      .lb-arrow.prev { left: 8px; }
      .lb-arrow.next { right: 8px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">BlurpleLab</a>
      <a href="index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </a>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <p class="page-header-eyebrow">AI · PropTech</p>
    <h1>Room Visualiser Test</h1>
    <p>Comparing AI room visualisation — ChatGPT vs Gemini</p>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- STYLE SELECTOR -->
    <div class="selector-wrap">
      <div class="style-pills">
        <button class="style-pill active" data-style="modern-african">🌍 Modern African Minimalist</button>
        <button class="style-pill" data-style="industrial">🏭 Industrial Urban</button>
        <button class="style-pill" data-style="eco">🌿 Eco</button>
        <button class="style-pill" data-style="coastal">🌊 Coastal Mediterranean</button>
        <button class="style-pill" data-style="cape-dutch">🏡 Cape Dutch</button>
      </div>
      <div class="style-desc" id="styleDesc">Warm neutrals · African art · Natural textures</div>
    </div>

    <!-- COMPARISON -->
    <div class="comparison">

      <div class="comp-col">
        <div class="comp-label original">
          <span>📷</span> Original
        </div>
        <div class="img-wrap original">
          <img src="Visualiser%20Images/Orginal_image.png" alt="Original room photo" />
        </div>
      </div>

      <div class="comp-col">
        <div class="comp-label chatgpt">
          <span>✦</span> ChatGPT
        </div>
        <div class="img-wrap chatgpt">
          <img id="imgChatgpt" src="Visualiser%20Images/Modern%20African%20Minimalist_GPT.png" alt="ChatGPT render" />
        </div>
      </div>

      <div class="comp-col">
        <div class="comp-label gemini">
          <span>✦</span> Gemini
        </div>
        <div class="img-wrap gemini">
          <img id="imgGemini" src="Visualiser%20Images/Modern%20African%20Minimalist_Gemini.png" alt="Gemini render" />
        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <a href="index.html" class="footer-logo">BlurpleLab</a>
    <span class="footer-copy">Cape Town &middot; 2025</span>
  </footer>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <div class="lb-backdrop" id="lbBackdrop"></div>

    <div class="lb-header">
      <div class="lb-meta">
        <span class="lb-label-text" id="lbLabel"></span>
        <span class="lb-style-text" id="lbStyleName"></span>
      </div>
      <button class="lb-close" id="lbClose">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <button class="lb-arrow prev" id="lbPrev">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <img class="lb-img" id="lbImg" src="" alt="" />

    <button class="lb-arrow next" id="lbNext">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <script>
    const STYLES = {
      'modern-african': {
        desc:   'Warm neutrals · African art · Natural textures',
        gpt:    'Visualiser%20Images/Modern%20African%20Minimalist_GPT.png',
        gemini: 'Visualiser%20Images/Modern%20African%20Minimalist_Gemini.png',
      },
      'industrial': {
        desc:   'Exposed brick · Concrete · Raw metals',
        gpt:    'Visualiser%20Images/Industrial_GPT.png',
        gemini: 'Visualiser%20Images/Industrial%20Urban_Gemini.png',
      },
      'eco': {
        desc:   'Living walls · Natural materials · Biophilic design',
        gpt:    'Visualiser%20Images/Eco_GPT.png',
        gemini: 'Visualiser%20Images/Eco_Gemini.png',
      },
      'coastal': {
        desc:   'Ocean blues · Whitewash · Rattan & linen',
        gpt:    'Visualiser%20Images/Coastal%20Mediterranean_GPT.png',
        gemini: 'Visualiser%20Images/Coastal%20Mediterranean_Gemini.png',
      },
      'cape-dutch': {
        desc:   'Heritage · Dark wood · Protea accents',
        gpt:    'Visualiser%20Images/Cape%20Dutch_GPT.png',
        gemini: 'Visualiser%20Images/Cape%20Dutch_Gemini.png',
      },
    };

    const imgChatgpt = document.getElementById('imgChatgpt');
    const imgGemini  = document.getElementById('imgGemini');
    const styleDesc  = document.getElementById('styleDesc');

    document.querySelectorAll('.style-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');

        const s = STYLES[pill.dataset.style];
        styleDesc.textContent = s.desc;
        imgChatgpt.src = s.gpt;
        imgGemini.src  = s.gemini;
      });
    });

    // ── LIGHTBOX ──
    const LB_META = [
      { label: '📷 Original', color: '#ffffff' },
      { label: '✦ ChatGPT',  color: '#10a37f' },
      { label: '✦ Gemini',   color: '#4285f4' },
    ];

    let lbIndex = 0;

    function getLbImages() {
      return [
        document.querySelector('.img-wrap.original img').src,
        document.getElementById('imgChatgpt').src,
        document.getElementById('imgGemini').src,
      ];
    }

    function getActiveStyleName() {
      return document.querySelector('.style-pill.active').textContent.trim();
    }

    function renderLightbox() {
      const meta = LB_META[lbIndex];
      document.getElementById('lbImg').src           = getLbImages()[lbIndex];
      document.getElementById('lbLabel').textContent = meta.label;
      document.getElementById('lbLabel').style.color = meta.color;
      document.getElementById('lbStyleName').textContent =
        lbIndex === 0 ? 'Reference photo' : getActiveStyleName();
    }

    function openLightbox(index) {
      lbIndex = index;
      renderLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function lbNav(dir) {
      lbIndex = (lbIndex + 3 + dir) % 3;
      renderLightbox();
    }

    document.getElementById('lbBackdrop').addEventListener('click', closeLightbox);
    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbPrev').addEventListener('click', () => lbNav(-1));
    document.getElementById('lbNext').addEventListener('click', () => lbNav(1));

    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowLeft')  lbNav(-1);
      if (e.key === 'ArrowRight') lbNav(1);
    });

    document.querySelectorAll('.img-wrap').forEach((wrap, i) => {
      wrap.addEventListener('click', () => openLightbox(i));
    });
  </script>

</body>
</html>
